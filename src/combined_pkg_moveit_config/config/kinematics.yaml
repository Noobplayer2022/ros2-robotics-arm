arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: True
# Using KDL here (ships with MoveIt2 core, guaranteed available) instead of
# TRAC-IK, since trac_ik_python's ROS2 packaging is not guaranteed on
# Lyrical yet. This only affects the MoveIt2/moveit_py blocking-move path
# (go_home/go_ready/transport) -- the real-time streaming loop in
# motion_control.py uses trac_ik_python directly (if installed) regardless
# of this file. If you get trac_ik working for ROS2, swap the line above to:
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
